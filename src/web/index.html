<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <link rel="stylesheet" href="/src/web/style.css" />
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <div id="flames" class="hud-tl"></div>
    <div id="clock" class="hud-tc">5:00</div>
    <div class="hud-tr"><div id="lamps">Đèn 0/5</div><div id="score">0</div></div>
    <div id="motebar" class="hud-bc"></div>
    <div class="hud-br">
      <div class="cd" id="cd-dash"><i></i><span>Lướt</span><b id="k-dash">Shift</b></div>
      <div class="cd" id="cd-pulse"><i></i><span>Tỏa Sáng</span><b id="k-pulse">F</b></div>
    </div>
    <div id="charm" class="hidden">Bùa Gió <span></span></div>
    <div id="hint"></div>
    <div id="arrow">▲</div>
    <div id="shadeArrow">▲</div>
    <div id="captions" aria-live="polite"></div>
    <div id="toast"></div>
    <div id="windwarn" class="hidden">Gió sắp nổi…</div>
    <div id="fps" class="hidden"></div>
  </div>

  <div id="flash"></div>
  <div id="overlay">
    <div class="card" id="card"></div>
  </div>

  <script type="module" src="/src/web/main.js"></script>
</body>
</html>
